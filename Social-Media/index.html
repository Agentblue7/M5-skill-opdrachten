<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="style.css" />
    <script
      src="https://kit.fontawesome.com/ca59deac32.js"
      crossorigin="anonymous"
    ></script>
    <script src="main.js" defer></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Instagram</title>
  </head>

  <body>
    <header>
      <nav class="navbar">
        <div class="container">
          <div class="logo">
            <a href="index.html">
              <img
                src="/images/14414683-instagram-zwart-logo-aan-transparant-achtergrond-gratis-vector.jpg"
                alt="Instagram logo"
                height="30"
              />
            </a>
          </div>

          <div class="searchbar">
            <input type="text" placeholder="Search" />
          </div>

          <div class="profile">
            <img
              src="images/instagram-profile-icon_772860-1198.avif"
              alt="User avatar"
              height="40"
            />
          </div>
        </div>
      </nav>
    </header>

    <main>
      <div class="container">
        <div class="column">
          <div class="statuses">
            <div class="status">
              <div class="image">
                <img
                  src="https://upload.wikimedia.org/wikipedia/commons/8/83/Steam_icon_logo.svg?utm_source=commons.wikimedia.org&amp;utm_campaign=index&amp;utm_content=original"
                  alt="Steam logo"
                />
              </div>
            </div>

            <div class="status">
              <div class="image">
                <img
                  src="https://upload.wikimedia.org/wikipedia/commons/2/24/LEGO_logo.svg?utm_source=nl.wikipedia.org&amp;utm_campaign=index&amp;utm_content=original"
                  alt="LEGO logo"
                />
              </div>
            </div>

            <div class="status">
              <div class="image">
                <img
                  src="https://1000logos.net/wp-content/uploads/2025/10/Counter-Strike-2-CS2-–-A-Modern-Evolution-2023–Present.png"
                  alt="Counter-Strike 2 logo"
                />
              </div>
            </div>

            <div class="status">
              <div class="image">
                <img
                  src="images/WIN_20261002_12_16_53_Pro.jpg"
                  alt="Status image"
                />
              </div>
            </div>

            <div class="status">
              <div class="image">
                <img
                  src="https://i-p.rmcdn.net/51949b9bb50eea00000003b9/1175932/image-eb5d6725-2b5d-44a3-8d3e-8ba4783723a5.jpg?w=2026&e=webp&cX=0&cY=70.96132358023283&cW=3508&cH=2338.0773528395343"
                  alt="navi logo"
                />
              </div>
            </div>

            <div class="status">
              <div class="image">
                <img
                  src="https://workingfamilies.org/wp-content/uploads/2025/05/036-1536x1536.png"
                  alt="Status image"
                />
              </div>
            </div>
          </div>

          <div class="card">
            <div class="top">
              <div class="userDetails">
                <div class="profilePic">
                  <div class="profile_img">
                    <div class="image">
                      <img
                        src="images/WIN_20261002_12_16_53_Pro.jpg"
                        alt="Joey Joosten's profile"
                      />
                    </div>
                  </div>
                </div>

                <h3>
                  Joey Joosten
                  <span>Alkmaar, The Netherlands</span>
                </h3>
              </div>

              <div>
                <span class="dot">
                  <i class="fa-solid fa-ellipsis"></i>
                </span>
              </div>
            </div>

            <div class="imgBox">
              <img
                src="images/8dbd5c301ac67eedb02c7248205eb173.jpg"
                alt="Post"
              />
            </div>

            <div class="bottom">
              <div class="actionBtns">
                <div class="left">
                  <i class="far fa-heart"></i>
                  <i class="far fa-comment"></i>
                  <i class="far fa-paper-plane"></i>
                </div>

                <div class="right">
                  <i class="far fa-bookmark"></i>
                </div>
              </div>

              <p class="likes">203 likes</p>
              <p class="message">
                <b>Joey Joosten ...</b>
                <span>more</span>
              </p>

              <a href="#">
                <h4 class="comments">View all 32 comments</h4>
              </a>

              <a href="#">
                <h5 class="postTime">2 hours ago</h5>
              </a>

              <div class="addComments">
                <div class="reaction">
                  <h3>
                    <i class="far fa-smile"></i>
                  </h3>
                </div>

                <input
                  type="text"
                  class="text"
                  placeholder="Add a comment..."
                />
                <a href="#">Post</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
